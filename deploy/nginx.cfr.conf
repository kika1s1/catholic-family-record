# Catholic Family Record — Nginx site
# Installed by CI/CD to /etc/nginx/sites-available/cfr
# After DNS points here, run: sudo bash deploy/enable-ssl.sh

upstream cfr_app {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Apex → www
server {
    listen 80;
    listen [::]:80;
    server_name catholicfamilyrecord.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.catholicfamilyrecord.com$request_uri;
    }
}

# Primary site + IP fallback until DNS/SSL are fully cut over
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.catholicfamilyrecord.com 67.205.132.40 _;

    client_max_body_size 8m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://cfr_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
