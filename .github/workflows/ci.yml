name: CI

on:
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install root
        run: npm ci

      - name: Install client
        run: npm ci
        working-directory: client

      - name: Install server
        run: npm ci
        working-directory: server

      - name: Typecheck server
        run: npx tsc --noEmit
        working-directory: server

      - name: Typecheck & build client
        run: npm run build
        working-directory: client

      - name: Build server
        run: npm run build
        working-directory: server
